name: aerostream
description: >-
  AeroStream is a cross-platform media client runtime. It ships with no
  content of its own: everything it plays comes from plugins the user installs
  (SkyStream, Vega and CloudStream ecosystems).
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  # State management + navigation.
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0

  # Networking.
  dio: ^5.4.3

  # AES, for the plugins that decrypt their own API payloads.
  pointycastle: ^3.7.0

  # Structured storage.
  sqlite3: ^2.4.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.3
  path: ^1.9.0
  shared_preferences: ^2.2.3

  # Plugin artifacts + untrusted payloads.
  archive: ^3.4.9
  crypto: ^3.0.3
  html: ^0.15.4

  # The plugin sandbox. QuickJS runs on its own isolate and enforces the memory
  # and time limits the runtime was designed around.
  #
  # 0.4.x is not on pub.dev and its git checkout pulls QuickJS in as a git
  # submodule, which pub does not fetch — the native build then fails. 0.3.7 is
  # the newest published release, ships the C sources in the archive, and has
  # the isolate API and the memory/time limits this runtime relies on.
  flutter_qjs: ^0.3.7

  # Video playback. media_kit wraps libmpv and ships per-platform native
  # libraries, which is what makes one player work on every target.
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7

  # Utilities.
  collection: ^1.18.0
  logger: ^2.2.0

dependency_overrides:
  # flutter_qjs 0.3.7 was published against ffi 1.x, and modern
  # path_provider_windows requires ffi 2.x — the two cannot coexist by
  # constraint. The package only uses `Utf8` and `calloc` from dart:ffi's
  # helper package, which are unchanged in 2.x, so the newer ffi is forced on
  # everyone. Drop this override when a released flutter_qjs moves to ffi 2.
  ffi: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/js/
